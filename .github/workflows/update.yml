name: Update POTA statistics

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Fetch POTA statistics
        run: python update_stats.py
      - name: Render QRZ panel
        run: python generate_panel.py
      - name: Commit generated data and image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats.json pota-stats.png
          if ! git diff --cached --quiet; then
            git commit -m 'Update POTA statistics and QRZ image'
            git push
          fi
